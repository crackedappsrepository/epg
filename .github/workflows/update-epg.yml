name: Auto-Update EPG

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

jobs:
  update-epg:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          
      - name: Install dependencies
        run: |
          npm install
          npm install -g tsx
          
      - name: Generate EPG guide
        run: |
          npm run grab --- --sites=tvguide.com --output=guide.xml
          
      - name: Check if guide was generated
        run: |
          if [ -f "guide.xml" ]; then
            echo "✅ guide.xml generated successfully!"
            ls -la guide.xml
          else
            echo "❌ guide.xml not found!"
            exit 1
          fi
          
      - name: Commit and push updated guide
        run: |
          git config user.name "GitHub Actions Bot"
          git config user.email "actions@github.com"
          git add guide.xml
          git commit -m "🤖 Auto-update EPG - $(date +'%Y-%m-%d %H:%M:%S')" || echo "No changes"
          git push
