name: Auto-Update All EPG Guides

on:
  schedule:
    # Runs every 4 hours
    - cron: '0 */4 * * *'
  workflow_dispatch: # Allows manual trigger

permissions:
  contents: write

concurrency:
  group: epg-auto-update
  cancel-in-progress: false

env:
  ACTIONS_RUNNER_DEPRECATION_WARNINGS: false

jobs:
  update-epg:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: true

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install dependencies
        run: |
          npm install --no-audit --no-fund
          npm install -g tsx --no-audit --no-fund

      - name: Generate EPG Guides (fault-tolerant, validated)
        run: |
          echo "=============================================="
          echo "📺 Generating EPG guides for existing files..."
          echo "=============================================="

          run_grab() {
            npm run grab -- "$@" && return 0
            echo "⚠️ npm run grab failed, falling back to npx epg..."
            npx --yes epg grab "$@"
          }

          update_guide() {
            FILE="$1"
            SITES="$2"
            CHANNELS="$3"
            
            # Dynamically build arguments array to safely handle special characters
            ARGS=("--sites=${SITES}" "--output=${FILE}.xml" "--days=3")
            if [ -n "$CHANNELS" ]; then
              ARGS+=("--channels=${CHANNELS}")
            fi

            for ATTEMPT in 1 2; do
              echo "🔄 ${FILE} attempt ${ATTEMPT} (sites: ${SITES})"
              if run_grab "${ARGS[@]}"; then
                if [ -s "${FILE}.xml" ] && grep -q "</tv>" "${FILE}.xml"; then
                  gzip -c "${FILE}.xml" > "${FILE}.xml.gz"
                  rm -f "${FILE}.xml"
                  echo "✅ ${FILE} updated"
                  return 0
                else
                  echo "⚠️ ${FILE}.xml missing or invalid, retrying..."
                  rm -f "${FILE}.xml"
                fi
              fi
              sleep 5
            done
            echo "❌ ${FILE} update failed - keeping previous guide"
            rm -f "${FILE}.xml"
            return 0
          }

          TARGET_SITES="tvguide.com,freeview.co.uk,sky.com,ontvtonight.com,tvhebdo.com,tvpassport.com"
          TARGET_CHANNELS="AlJazeera.qa@English,AE.us@East,BBCOne.uk@LondonHD,BBCThree.uk@SD,BBCTwo.uk@England,BBCNews.uk@Africa,Bravo.us@East,BET.us@East,cartoon-network,challenge,CNN.us@SD,ComedyCentral.uk@HD,crave1--east-hd/2820,crave2--east/86,crave3--east-hd/7137,crave4-hd/10781,FoxNewsChannel.us@SD,game-show-network--west/13459,game-tv/5976,HBO.us@East,HBO2.us@East,hustler-tv-usa-on-demand/10171,ITV1.uk@Central,ITV2.uk@SD,ITV3.uk@SD,Nickelodeon.uk@SD,NickJr.ie@SD,RTEOne.ie@HD,RTE2.ie@HD,sky-Atlantic,sky-cinema-action,sky-cinema-greats,sky-cinema-hits,sky-cinema-premiere,SkyMix.uk@HD,SkySportsFootball.uk@HD,SkySportsMainEvent.uk@HD,SkySportsPremierLeague.uk@HD,Syfy.us@East,TNTSports1.uk@HD,TNTSports2.uk@HD,TNTSports3.uk@HD,TNTSports4.uk@HD,TSN1.ca@SD,TSN2.ca@SD,TSN3.ca@SD,TSN4.ca@SD,TSN5.ca@SD"
          
          update_guide guide_ca "${TARGET_SITES}" "${TARGET_CHANNELS}"

          echo "=============================================="
          echo "✅ Update pass complete"
          echo "=============================================="
          ls -la guide_*.xml.gz || true

      - name: Commit and push updated guides
        run: |
          echo ""
          echo "📤 Committing and pushing to GitHub..."
          git config user.name "GitHub Actions Bot"
          git config user.email "actions@github.com"
          git add guide_*.xml.gz 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "🤖 Auto-update CA guide - $(date +'%Y-%m-%d %H:%M:%S')"
            git push origin HEAD:main || git push
          fi
          echo "✅ Done!"
