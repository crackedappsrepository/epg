name: Auto-Update EPG

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  update-epg:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          
      - name: Install dependencies
        run: npm install
        
      - name: Generate EPG guide
        run: |
          npm run grab --- --sites=tvguide.com --output=guide.xml || echo "Grab command failed"
          
      - name: Check if guide was generated
        run: |
          if [ -f "guide.xml" ]; then
            echo "✅ guide.xml generated!"
            ls -la guide.xml
            exit 0
          else
            echo "❌ guide.xml not found! Generating fallback."
            echo "<?xml version='1.0' encoding='UTF-8'?><tv></tv>" > guide.xml
            exit 0
          fi
          
      - name: Commit and push updated guide
        run: |
          git config user.name "GitHub Actions Bot"
          git config user.email "actions@github.com"
          git add guide.xml
          git commit -m "🤖 Auto-update EPG - $(date +'%Y-%m-%d %H:%M:%S')" || echo "No changes to commit"
          git push || echo "Push skipped"
