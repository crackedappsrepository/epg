name: Auto-Update EPG (USA + UK) with Compression

on:
  schedule:
    # Runs every 4 hours
    - cron: '0 */4 * * *'
  workflow_dispatch: # Allows manual trigger

jobs:
  update-epg:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          
      - name: Install dependencies
        run: |
          npm install
          npm install -g tsx
          
      - name: Generate USA + UK EPG guide
        run: |
          echo "📺 Generating EPG guide for USA and UK..."
          npm run grab --- --sites=tvguide.com,freeview.co.uk --output=guide.xml --days=2
          echo "✅ EPG guide generated!"
          ls -la guide.xml
          
      - name: Compress guide.xml to .gz
        run: |
          echo "📦 Compressing guide.xml..."
          gzip -c guide.xml > guide.xml.gz
          echo "✅ Compression complete!"
          echo "Original size: $(du -h guide.xml | cut -f1)"
          echo "Compressed size: $(du -h guide.xml.gz | cut -f1)"
          
      - name: Remove uncompressed guide (to save space)
        run: |
          rm guide.xml
          echo "🗑️ Uncompressed guide removed, keeping only .gz"
          
      - name: Commit and push compressed guide
        run: |
          git config user.name "GitHub Actions Bot"
          git config user.email "actions@github.com"
          git add guide.xml.gz
          git commit -m "🤖 Auto-update EPG (USA+UK) - $(date +'%Y-%m-%d %H:%M:%S')" || echo "No changes to commit"
          git push || echo "Push skipped (no changes)"
