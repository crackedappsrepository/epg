name: Auto-Update All EPG Guides

on:
  schedule:
    # Runs every 4 hours
    - cron: '0 */4 * * *'
  workflow_dispatch: # Allows manual trigger

permissions:
  contents: write

concurrency:
  group: epg-auto-update
  cancel-in-progress: false

env:
  # ✅ Suppress Node 20 deprecation warnings from action internals
  ACTIONS_RUNNER_DEPRECATION_WARNINGS: false

jobs:
  update-epg:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: true

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install dependencies
        run: |
          npm install --no-audit --no-fund
          npm install -g tsx --no-audit --no-fund

      - name: Generate EPG Guides (fault-tolerant, validated)
        run: |
          echo "=============================================="
          echo "📺 Generating EPG guides for existing files..."
          echo "=============================================="

          # ✅ FIX 1: correct '--' delimiter + npx fallback if script missing
          run_grab() {
            npm run grab -- "$@" && return 0
            echo "⚠️ npm run grab failed, falling back to npx epg..."
            npx --yes epg grab "$@"
          }

          # ✅ FIX 3: per-guide retries, never kills the job
          # ✅ FIX 4: validates XML before replacing the .gz
          update_guide() {
            FILE="$1"
            SITES="$2"
            if [ ! -f "${FILE}.xml.gz" ] && [ ! -f "${FILE}.xml" ]; then
              echo "⏭️ Skipping ${FILE} (not in repository)"
              return 0
            fi
            for ATTEMPT in 1 2; do
              echo "🔄 ${FILE} attempt ${ATTEMPT} (sites: ${SITES})"
              if run_grab --sites="${SITES}" --output="${FILE}.xml" --days=2; then
                if [ -s "${FILE}.xml" ] && grep -q "</tv>" "${FILE}.xml"; then
                  gzip -c "${FILE}.xml" > "${FILE}.xml.gz"
                  rm -f "${FILE}.xml"
                  echo "✅ ${FILE} updated"
                  return 0
                else
                  echo "⚠️ ${FILE}.xml missing or invalid, retrying..."
                  rm -f "${FILE}.xml"
                fi
              fi
              sleep 5
            done
            echo "❌ ${FILE} update failed - keeping previous guide"
            rm -f "${FILE}.xml"
            return 0
          }

          update_guide guide_us tvguide.com
          update_guide guide_gb freeview.co.uk
          update_guide guide_uk sky.com
          update_guide guide_ca tvguide.com
          update_guide guide_gh dstv.com

          echo "=============================================="
          echo "✅ Update pass complete"
          echo "=============================================="
          ls -la guide_*.xml.gz || true

      - name: Commit and push updated guides
        run: |
          echo ""
          echo "📤 Committing and pushing to GitHub..."
          git config user.name "GitHub Actions Bot"
          git config user.email "actions@github.com"
          git add guide_*.xml.gz 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "🤖 Auto-update existing guides - $(date +'%Y-%m-%d %H:%M:%S')"
            # ✅ FIX 2: explicit branch push with token fallback
            git push origin HEAD:main || git push
          fi
          echo "✅ Done!"
