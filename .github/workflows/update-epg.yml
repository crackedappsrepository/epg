name: Auto-Update All EPG Guides

on:
  schedule:
    # Runs every 4 hours
    - cron: '0 */4 * * *'
  workflow_dispatch: # Allows manual trigger

jobs:
  update-epg:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          
      - name: Install dependencies
        run: |
          npm install
          npm install -g tsx
          
      - name: Generate All Country EPG Guides
        run: |
          echo "📺 Generating country-specific EPG guides..."
          echo "=============================================="
          
          # USA
          echo ""
          echo "🇺🇸 Generating USA guide (tvguide.com)..."
          npm run grab --- --sites=tvguide.com --output=guide_usa.xml --days=2
          echo "✅ USA guide generated!"
          
          # UK
          echo ""
          echo "🇬🇧 Generating UK guide (freeview.co.uk)..."
          npm run grab --- --sites=freeview.co.uk --output=guide_uk.xml --days=2
          echo "✅ UK guide generated!"
          
          # Ghana (DStv - African channels)
          echo ""
          echo "🇬🇭 Generating Ghana guide (dstv.com)..."
          npm run grab --- --sites=dstv.com --output=guide_ghana.xml --days=2
          echo "✅ Ghana guide generated!"
          
          # Germany
          echo ""
          echo "🇩🇪 Generating Germany guide (sky.com)..."
          npm run grab --- --sites=sky.com --output=guide_germany.xml --days=2
          echo "✅ Germany guide generated!"
          
          # Italy
          echo ""
          echo "🇮🇹 Generating Italy guide (sky.com)..."
          npm run grab --- --sites=sky.com --output=guide_italy.xml --days=2
          echo "✅ Italy guide generated!"
          
          echo ""
          echo "=============================================="
          echo "✅ All guides generated successfully!"
          ls -la guide_*.xml
          
      - name: Compress All Guides
        run: |
          echo "📦 Compressing all guides..."
          echo "=============================================="
          
          gzip -c guide_usa.xml > guide_usa.xml.gz
          echo "✅ guide_usa.xml.gz"
          
          gzip -c guide_uk.xml > guide_uk.xml.gz
          echo "✅ guide_uk.xml.gz"
          
          gzip -c guide_ghana.xml > guide_ghana.xml.gz
          echo "✅ guide_ghana.xml.gz"
          
          gzip -c guide_germany.xml > guide_germany.xml.gz
          echo "✅ guide_germany.xml.gz"
          
          gzip -c guide_italy.xml > guide_italy.xml.gz
          echo "✅ guide_italy.xml.gz"
          
          echo "=============================================="
          echo "📊 Compression complete!"
          ls -la guide_*.xml.gz
          
      - name: Clean up uncompressed files
        run: |
          echo "🗑️ Removing uncompressed files to save space..."
          rm guide_*.xml
          echo "✅ Cleanup complete!"
          
      - name: Commit and push compressed guides
        run: |
          git config user.name "GitHub Actions Bot"
          git config user.email "actions@github.com"
          git add guide_*.xml.gz
          git commit -m "🤖 Auto-update all country guides - $(date +'%Y-%m-%d %H:%M:%S')" || echo "No changes to commit"
          git push || echo "Push skipped (no changes)"
