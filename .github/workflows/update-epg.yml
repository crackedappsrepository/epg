name: Auto-Update All EPG Guides

on:
  schedule:
    # Runs every 4 hours
    - cron: '0 */4 * * *'
  workflow_dispatch: # Allows manual trigger

jobs:
  update-epg:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          
      - name: Install dependencies
        run: |
          npm install
          npm install -g tsx
          
      - name: Generate EPG Guides (Only existing files)
        run: |
          echo "=============================================="
          echo "📺 Generating EPG guides for existing files..."
          echo "=============================================="
          
          # Check which guide files exist in the repository
          # Only generate guides for files that already exist
          
          # US (tvguide.com)
          if [ -f "guide_us.xml.gz" ] || [ -f "guide_us.xml" ]; then
            echo ""
            echo "🇺🇸 Updating US guide (tvguide.com)..."
            npm run grab --- --sites=tvguide.com --output=guide_us.xml --days=2
            gzip -c guide_us.xml > guide_us.xml.gz
            rm guide_us.xml
            echo "✅ US guide updated!"
          else
            echo "⏭️ Skipping US guide (not in repository)"
          fi
          
          # GB - Freeview (United Kingdom)
          if [ -f "guide_gb.xml.gz" ] || [ -f "guide_gb.xml" ]; then
            echo ""
            echo "🇬🇧 Updating GB guide (freeview.co.uk)..."
            npm run grab --- --sites=freeview.co.uk --output=guide_gb.xml --days=2
            gzip -c guide_gb.xml > guide_gb.xml.gz
            rm guide_gb.xml
            echo "✅ GB guide updated!"
          else
            echo "⏭️ Skipping GB guide (not in repository)"
          fi
          
          # UK - Sky (United Kingdom)
          if [ -f "guide_uk.xml.gz" ] || [ -f "guide_uk.xml" ]; then
            echo ""
            echo "🇬🇧 Updating UK guide (sky.com)..."
            npm run grab --- --sites=sky.com --output=guide_uk.xml --days=2
            gzip -c guide_uk.xml > guide_uk.xml.gz
            rm guide_uk.xml
            echo "✅ UK guide updated!"
          else
            echo "⏭️ Skipping UK guide (not in repository)"
          fi
          
          # CA - Canada (only if exists)
          if [ -f "guide_ca.xml.gz" ] || [ -f "guide_ca.xml" ]; then
            echo ""
            echo "🇨🇦 Updating CA guide (tvguide.com)..."
            npm run grab --- --sites=tvguide.com --output=guide_ca.xml --days=2
            gzip -c guide_ca.xml > guide_ca.xml.gz
            rm guide_ca.xml
            echo "✅ CA guide updated!"
          else
            echo "⏭️ Skipping CA guide (not in repository)"
          fi
          
          # GH - Ghana (only if exists)
          if [ -f "guide_gh.xml.gz" ] || [ -f "guide_gh.xml" ]; then
            echo ""
            echo "🇬🇭 Updating GH guide (dstv.com)..."
            npm run grab --- --sites=dstv.com --output=guide_gh.xml --days=2
            gzip -c guide_gh.xml > guide_gh.xml.gz
            rm guide_gh.xml
            echo "✅ GH guide updated!"
          else
            echo "⏭️ Skipping GH guide (not in repository)"
          fi
          
          echo ""
          echo "=============================================="
          echo "✅ All existing guides updated!"
          echo "=============================================="
          ls -la guide_*.xml.gz
          
      - name: Commit and push updated guides
        run: |
          echo ""
          echo "📤 Committing and pushing to GitHub..."
          git config user.name "GitHub Actions Bot"
          git config user.email "actions@github.com"
          git add guide_*.xml.gz
          git commit -m "🤖 Auto-update existing guides - $(date +'%Y-%m-%d %H:%M:%S')" || echo "No changes to commit"
          git push || echo "Push skipped (no changes)"
          echo "✅ Done!"
