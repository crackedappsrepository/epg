name: Auto-Update EPG

on:
  schedule:
    # Runs every 6 hours
    - cron: '0 */6 * * *'
  workflow_dispatch: # Allows manual run

jobs:
  update-epg:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          
      - name: Install dependencies
        run: npm install
        
      - name: Generate EPG guide
        run: |
          npm run grab --- --sites=tvguide.com --output=guide.xml
          
      - name: Commit and push updated guide
        run: |
          git config user.name "GitHub Actions Bot"
          git config.user.email "actions@github.com"
          git add guide.xml
          git commit -m "🤖 Auto-update EPG - $(date +'%Y-%m-%d %H:%M:%S')" || echo "No changes"
          git push
